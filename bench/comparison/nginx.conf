worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
}

stream {
    upstream ringzero_backends {
        server 10.20.0.2:9000;
        server 10.30.0.2:9000;
    }

    server {
        listen 10.99.0.1:9000 udp reuseport rcvbuf=8m sndbuf=8m;
        proxy_pass ringzero_backends;
        proxy_timeout 30s;

        # proxy_responses is intentionally left unset. Setting it to 0 means
        # "close the session after one client datagram has been proxied",
        # not "don't wait for a response" -- against a backend that never
        # replies (bench/../scripts/udp_sink.py) that tears down and rebuilds
        # the upstream connection on every single packet and collapses
        # throughput to near zero. Leaving it unset uses proxy_timeout
        # instead, which is what you want for one-way UDP traffic.
    }
}
